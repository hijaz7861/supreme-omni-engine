name: Open new issue automatically
on:
  workflow_dispatch: # Manual trigger option
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante baad automatic chalega

jobs:
  open-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - run: |
          gh issue --repo ${{ github.repository }} \
            create --title "Automatic Task Run" --body "Automated background process executed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
